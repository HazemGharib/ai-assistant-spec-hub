openapi: 3.1.0
info:
  title: Backend ↔ RAG Retrieve Contract
  version: 0.1.0
  description: |
    Retrieval boundary between ai-assistant-backend and ai-assistant-rag.
    Phase 1 stub may return fixture chunks. No auth.
servers:
  - url: http://127.0.0.1:3002
    description: Local RAG default
paths:
  /health:
    get:
      operationId: ragHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /v1/retrieve:
    post:
      operationId: retrieve
      summary: Retrieve knowledge chunks for a query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveRequest"
      responses:
        "200":
          description: Retrieval result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    RetrieveRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        conversationId:
          type: string
          format: uuid
          nullable: true
    RetrievedChunk:
      type: object
      required: [chunkId, documentId, text, source, score]
      properties:
        chunkId:
          type: string
        documentId:
          type: string
        text:
          type: string
        source:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1
        title:
          type: string
          nullable: true
        pageOrSection:
          type: string
          nullable: true
    RetrieveResult:
      type: object
      required: [query, chunks]
      properties:
        query:
          type: string
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/RetrievedChunk"
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, UPSTREAM_UNAVAILABLE, INTERNAL_ERROR]
        message:
          type: string
